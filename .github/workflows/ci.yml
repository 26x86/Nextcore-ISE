name: NextCore ISE CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-arm
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - name: ARM architectural reference tests
        run: cargo test --manifest-path runtime/preos/Cargo.toml
      - name: Native x86 JIT and software PAC execution
        run: python3 tools/probe_efi_native_pauth.py
      - name: GOP bounds and error propagation
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined runtime/gop_scanout.c runtime/test_gop_scanout.c -o /tmp/gop-test
          /tmp/gop-test
      - name: Check architectural 4K and 16K upper-address translations
        run: |
          python3 tools/probe_mmu_granules.py
          python3 tools/probe_mmu_physical.py
      - name: Compare integer pair transfers with an independent Arm CPU
        run: python3 tools/probe_pair_memory.py
      - name: Compare scalar widths and signed loads with an independent Arm CPU
        run: python3 tools/probe_scalar_memory.py
      - name: Native C to Rust memory provider and negative control
        run: |
          python3 tools/probe_efi_memory_provider.py --output "$RUNNER_TEMP/native-memory-provider"
          python3 tools/probe_pc_alignment.py --output "$RUNNER_TEMP/pc-alignment"
          cargo test --manifest-path runtime/memory-service/Cargo.toml
          rustup target add x86_64-unknown-uefi
          cargo check --manifest-path runtime/memory-service/Cargo.toml --target x86_64-unknown-uefi
