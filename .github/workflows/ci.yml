name: NextCore ISE CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang clang-18 llvm-18 lld qemu-system-arm
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - name: ARM architectural reference tests
        run: cargo test --manifest-path runtime/preos/Cargo.toml
      - name: Native x86 JIT and software PAC execution
        run: python3 tools/probe_efi_native_pauth.py
      - name: GOP bounds and error propagation
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined runtime/gop_scanout.c runtime/test_gop_scanout.c -o /tmp/gop-test
          /tmp/gop-test
      - name: Check architectural 4K and 16K upper-address translations
        run: |
          python3 tools/probe_mmu_granules.py
          python3 tools/probe_mmu_physical.py
      - name: Compare integer pair transfers with an independent Arm CPU
        run: python3 tools/probe_pair_memory.py
      - name: Compare scalar widths and signed loads with an independent Arm CPU
        run: python3 tools/probe_scalar_memory.py
      - name: Compare conditional flags with an independent Arm CPU
        run: python3 tools/probe_conditional_compare.py --work-dir "$RUNNER_TEMP/conditional-compare" --output "$RUNNER_TEMP/conditional-compare.json"
      - name: Compare exact stage-1 fault levels and captured table inputs
        run: |
          python3 tools/mmu_fault_levels/probe_fault_levels.py --output "$RUNNER_TEMP/mmu-level-at"
          python3 tools/mmu_fault_levels/probe_abort_levels.py --output "$RUNNER_TEMP/mmu-level-abort"
          python3 tools/mmu_fault_levels/compare_current_walker.py --runtime-checkout . \
            --at-report "$RUNNER_TEMP/mmu-level-at/report.json" \
            --abort-report "$RUNNER_TEMP/mmu-level-abort/report.json" \
            --output "$RUNNER_TEMP/mmu-level-comparison"
      - name: Native C to Rust memory provider and negative control
        run: |
          python3 tools/probe_efi_memory_provider.py --work-dir "$RUNNER_TEMP/native-memory-provider" --output "$RUNNER_TEMP/native-memory-provider.json"
          python3 tools/probe_pc_alignment.py --work-dir "$RUNNER_TEMP/pc-alignment" --output "$RUNNER_TEMP/pc-alignment.json"
          cargo test --manifest-path runtime/memory-service/Cargo.toml
          rustup target add x86_64-unknown-uefi
          cargo build --release --manifest-path runtime/memory-service/Cargo.toml --target x86_64-unknown-uefi
      - name: Native translated C to Rust memory provider and semantic negative controls
        run: python3 tools/probe_efi_stage1_provider.py --work-dir "$RUNNER_TEMP/native-stage1-provider" --output "$RUNNER_TEMP/native-stage1-provider.json"
      - name: Transactional one-way MMU activation and semantic negative controls
        run: python3 tools/probe_dynamic_memory.py --work-dir "$RUNNER_TEMP/dynamic-memory" --output "$RUNNER_TEMP/dynamic-memory.json"
      - name: UBFM native and reference execution with precise undefined syndromes
        run: python3 tools/probe_ubfm_native.py --work-dir "$RUNNER_TEMP/ubfm-native" --output "$RUNNER_TEMP/ubfm-native.json"
      - name: Exact ISAR2 scalar profile and native provider regressions
        run: python3 runtime/tests/verify_isar2_native.py --output "$RUNNER_TEMP/isar2-native"
